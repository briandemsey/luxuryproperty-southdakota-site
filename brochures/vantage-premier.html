<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage Premier — 2111 Vantage Circle | Brochure</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #14171b;
    --muted: #7c8189;
    --line: #cec8b8;
    --accent: #9a7c3f;
    --accent-deep: #6d5628;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Cormorant Garamond", "Garamond", "Sabon", "Iowan Old Style", "Georgia", Cambria, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 1.5rem;
    background: #101216;
    color: #fff;
  }
  .bar-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(255,255,255,0.92);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar a.return {
    flex: none;
    display: inline-block;
    font-family: var(--sans);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    padding: 0.55rem 1.1rem;
    border: 1px solid rgba(255,255,255,0.4);
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .bar a.return:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .pdf-frame {
    display: block;
    width: 100%;
    height: calc(100% - 56px);
    border: none;
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="bar-title">Vantage Premier &mdash; 2111 Vantage Circle</div>
    <a class="return" href="../index.html#brochures">&larr; Return to Index</a>
  </div>
  <iframe class="pdf-frame" src="photos/vantage-premier.pdf" title="Vantage Premier brochure — 2111 Vantage Circle, Spearfish, SD"></iframe>
</body>
</html>
